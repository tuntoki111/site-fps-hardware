    <main>
        <section>
            <h2>Trimite-ne un Mesaj</h2>
            <p>Dacă dorești teste FPS pentru o anumită configurație, completează formularul de mai jos:</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="nume">Nume complet:</label>
                    <input type="text" id="nume" name="nume" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresă E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="mesaj">Mesajul tău (componente / întrebare):</label>
                    <textarea id="mesaj" name="mesaj" rows="4" required></textarea>
                </div>

                <button type="submit">Trimite Mesajul</button>
            </form>
        </section>
